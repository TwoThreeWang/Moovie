version: '3.8'

services:
  app:
    build: .
    container_name: moovie-app
    ports:
      - "5007:5007"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      # 如下几行是 WARP 代理配置，如果没有 WARP 代理，注释掉即可
      # WARP 代理配置 - 走 SOCKS5
      - HTTP_PROXY=socks5://cloudflare-warp:1080
      - HTTPS_PROXY=socks5://cloudflare-warp:1080
      - ALL_PROXY=socks5://cloudflare-warp:1080
      # 排除本地和内部服务
      - NO_PROXY=localhost,127.0.0.1,postgres
    restart: unless-stopped
    networks:
      - postgres_default
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  postgres_default:
    external: true