<div class="action-modal-overlay" id="mark-watched-modal" onclick="if(event.target==this) this.remove()" onkeydown="if(event.key==='Escape') this.remove()">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="mark-watched-title">
        <button type="button" class="modal-close-btn" aria-label="关闭评分窗口" onclick="document.getElementById('mark-watched-modal').remove()" autofocus>×</button>

        <div class="modal-header">
            <h3 class="modal-title" id="mark-watched-title">标记为“已看过”</h3>
            <p class="modal-subtitle">《{{ .Title }}》</p>
        </div>

        <form
            hx-post="/api/user-movies/{{ .DoubanID }}/watched"
            hx-target="#{{ default (printf "actions-%s" .DoubanID) .TargetID }}"
            hx-swap="outerHTML"
            hx-on::after-request="document.getElementById('mark-watched-modal').remove()"
            class="modal-form"
        >
            <input type="hidden" name="title" value="{{ .Title }}">
            <input type="hidden" name="poster" value="{{ .Poster }}">
            <input type="hidden" name="year" value="{{ .Year }}">
            <input type="hidden" name="variant" value="{{ .Variant }}">
            <input type="hidden" name="rating" id="rating-input" value="0">

            <div class="form-group">
                <span class="form-label" id="rating-label">点击分值完成评分</span>
                <div class="score-chips-group" role="group" aria-labelledby="rating-label">
                    <button type="button" class="score-chip" aria-pressed="false" onclick="selectScore(1, this)">
                        <span class="chip-label">1分</span>
                        <span class="chip-desc">很差</span>
                    </button>
                    <button type="button" class="score-chip" aria-pressed="false" onclick="selectScore(2, this)">
                        <span class="chip-label">2分</span>
                        <span class="chip-desc">较差</span>
                    </button>
                    <button type="button" class="score-chip" aria-pressed="false" onclick="selectScore(3, this)">
                        <span class="chip-label">3分</span>
                        <span class="chip-desc">还行</span>
                    </button>
                    <button type="button" class="score-chip" aria-pressed="false" onclick="selectScore(4, this)">
                        <span class="chip-label">4分</span>
                        <span class="chip-desc">推荐</span>
                    </button>
                    <button type="button" class="score-chip" aria-pressed="false" onclick="selectScore(5, this)">
                        <span class="chip-label">5分</span>
                        <span class="chip-desc">力荐</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="watched-comment">简短评价</label>
                <textarea id="watched-comment" name="comment" rows="3" class="form-textarea" placeholder="写几句感受..."></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('mark-watched-modal').remove()">取消</button>
                <button type="submit" class="btn btn-submit">确定标记</button>
            </div>
        </form>
    </div>

    <script>
        function selectScore(score, el) {
            document.getElementById('rating-input').value = score;
            document.querySelectorAll('#mark-watched-modal .score-chip').forEach(c => {
                c.classList.remove('active');
                c.setAttribute('aria-pressed', 'false');
            });
            el.classList.add('active');
            el.setAttribute('aria-pressed', 'true');
        }
    </script>
</div>
