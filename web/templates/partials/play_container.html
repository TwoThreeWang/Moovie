{{/* 两种播放入口共用空状态；没有地址时不初始化播放器。 */}}
<section class="video-section">
    <div class="video-container" id="player-container">
        {{ if .PlayURL }}
        <div id="artplayer-app"></div>
        {{ else }}
        <div class="video-loading">
            <span>{{ if .EmptyMessage }}{{ .EmptyMessage }}{{ else }}暂无可用播放链接{{ end }}</span>
        </div>
        {{ end }}
    </div>
</section>

{{ if .PlayURL }}
{{ template "play_disclaimer.html" . }}
{{ end }}
