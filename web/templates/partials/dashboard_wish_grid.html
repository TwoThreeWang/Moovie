{{ define "dashboard_wish_grid.html" }}
{{ range .Wish }}
<div class="movie-card-wrapper" id="wish-{{ .ID }}">
    <a href="/movie/{{ .MovieID }}?title={{ .Title }}" class="movie-card">
        <div class="movie-poster">
            <img src="{{ proxyImg .Poster }}" alt="{{ .Title }}" loading="lazy" onerror="this.onerror=null;this.src='/static/img/placeholder.svg'">
            {{ if .Rating }}
            <span class="movie-rating">{{ .Rating }}</span>
            {{ end }}
        </div>
        <div class="movie-info">
            <h3 class="movie-title">{{ .Title }}</h3>
            <p class="movie-year">{{ .Year }}</p>
        </div>
    </a>
    <button class="watch-delete-btn"
            hx-delete="/api/user-movies/{{ .MovieID }}"
            hx-target="#wish-{{ .ID }}"
            hx-swap="outerHTML"
            hx-confirm="确定取消“想看”吗？"
            title="取消此标记">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>
{{ end }}
{{ if .HasMore }}
<div id="wish-load-more" class="load-more-container">
    <button class="btn btn-outline"
            hx-get="/api/htmx/dashboard/wish?page={{ .NextPage }}"
            hx-target="#wish-load-more"
            hx-swap="outerHTML">
        加载更多
    </button>
</div>
{{ end }}
{{ end }}
