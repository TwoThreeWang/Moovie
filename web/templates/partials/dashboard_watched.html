{{ if .Watched }}
<div class="watched-list" id="watched-list">
    {{ range .Watched }}
        {{ template "dashboard_watched_item.html" . }}
    {{ end }}
    {{ if .HasMore }}
    <div id="watched-load-more" class="load-more-container">
        <button class="btn btn-outline"
                hx-get="/api/htmx/dashboard/watched?page={{ .NextPage }}"
                hx-target="#watched-load-more"
                hx-swap="outerHTML">
            加载更多
        </button>
    </div>
    {{ end }}
</div>
{{ else if .IsFirstPage }}
<div class="empty-state">
    <p>还没有“已看过”的影片</p>
    <a href="/" class="btn btn-primary">去发现好片</a>
</div>
{{ end }}
