{{ define "dashboard_watched_grid.html" }}
{{ range .Watched }}
    {{ template "dashboard_watched_item.html" . }}
{{ end }}
{{ if .HasMore }}
<div id="watched-load-more" class="load-more-container" style="display: flex; justify-content: center; padding: 20px 0;">
    <button class="btn btn-outline"
            hx-get="/api/htmx/dashboard/watched?page={{ .NextPage }}"
            hx-target="#watched-load-more"
            hx-swap="outerHTML">
        加载更多
    </button>
</div>
{{ end }}
{{ end }}
