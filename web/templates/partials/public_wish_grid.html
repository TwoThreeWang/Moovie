{{ define "public_wish_grid.html" }}
{{ range .WishList }}
<a href="/movie/{{ .MovieID }}?title={{ .Title }}" class="pub-wish-card">
    <div class="pub-wish-poster">
        <img src="{{ proxyImg .Poster }}" alt="{{ .Title }}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='/static/img/placeholder.svg'">
        {{ if .Rating }}<span class="pub-wish-rating">{{ .Rating }}</span>{{ end }}
    </div>
    <div class="pub-wish-info">
        <h3 class="pub-wish-title">{{ .Title }}</h3>
        <p class="pub-wish-year">{{ .Year }}</p>
    </div>
</a>
{{ end }}
{{ if .WishHasMore }}
<div id="pub-wish-load-more" class="load-more-container">
    <button class="btn btn-outline"
            hx-get="/api/htmx/public/{{ .UserID }}/wish?page={{ .WishNextPage }}"
            hx-target="#pub-wish-load-more"
            hx-swap="outerHTML">
        加载更多
    </button>
</div>
{{ end }}
{{ end }}
