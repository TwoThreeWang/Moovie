{{ define "content" }}
<div class="notifications-page">
    <header class="notifications-header">
        <div>
            <p class="notifications-kicker">INTERACTIONS</p>
            <h1>消息</h1>
            <p>片友对你短评的点赞与回复。</p>
        </div>
        {{ if .Notifications }}
        <button type="button" class="btn btn-ghost btn-sm"
                hx-post="/notifications/read-all" hx-target="#notification-list" hx-swap="innerHTML">
            全部已读
        </button>
        {{ end }}
    </header>
    <section id="notification-list" aria-live="polite">
        {{ template "notification_list.html" . }}
    </section>
</div>
{{ end }}

{{ define "extra_head" }}
<style>
.notifications-page { max-width: 760px; margin: 0 auto; padding: 1.25rem 0 3rem; }
.notifications-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
.notifications-header h1 { margin: .15rem 0 .35rem; font-size: 2rem; }
.notifications-header p { margin: 0; color: var(--text-muted); }
.notifications-kicker { color: var(--primary) !important; font-size: .68rem; font-weight: 700; letter-spacing: .14em; }
.notification-list { border-top: 1px solid var(--border); }
.notification-item { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: .25rem; align-items: center; border-bottom: 1px solid var(--border); }
.notification-open { width: 100%; display: grid; grid-template-columns: 38px minmax(0, 1fr) 8px; gap: .85rem; align-items: start; padding: 1rem .25rem; color: inherit; text-align: left; }
.notification-open:hover { background: var(--bg-secondary); }
.notification-item.is-unread .notification-summary { color: var(--text); }
.notification-delete { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-sm); color: var(--text-muted); }
.notification-delete:hover { background: var(--error-bg); color: var(--error); }
.notification-delete svg { width: 16px; height: 16px; }
.notification-avatar { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--bg-secondary); font-size: 1.1rem; }
.notification-copy { min-width: 0; display: flex; flex-direction: column; gap: .28rem; }
.notification-summary { color: var(--text-secondary); font-size: .9rem; line-height: 1.5; }
.notification-summary strong { color: var(--text); }
.notification-content { overflow: hidden; color: var(--text-muted); font-size: .82rem; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }
.notification-copy time { color: var(--text-muted); font-size: .7rem; }
.notification-unread-dot { width: 7px; height: 7px; margin-top: .45rem; border-radius: 50%; background: var(--primary); }
.notifications-empty { padding: 5rem 1rem; text-align: center; color: var(--text-muted); }
.notifications-empty > span { display: block; margin-bottom: .8rem; font-size: 2rem; filter: grayscale(.25); }
.notifications-empty p { margin: 0 0 .3rem; color: var(--text-secondary); font-weight: 600; }
.notifications-empty small { font-size: .78rem; }
@media (max-width: 600px) {
    .notifications-page { padding-top: .5rem; }
    .notifications-header { align-items: center; }
    .notifications-header h1 { font-size: 1.6rem; }
    .notification-item { grid-template-columns: minmax(0, 1fr) 34px; }
    .notification-open { grid-template-columns: 34px minmax(0, 1fr) 7px; padding: .9rem 0; }
    .notification-avatar { width: 34px; height: 34px; }
}
</style>
{{ end }}
