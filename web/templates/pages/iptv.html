<div class="iptv-page">
    <!-- 频道侧边栏 -->
    <aside class="iptv-sidebar" id="iptv-sidebar">
        <div class="iptv-sidebar-header">
            <h2 class="iptv-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                    <polyline points="17 2 12 7 7 2"></polyline>
                </svg>
                频道列表
            </h2>
            <button class="iptv-toggle-btn" onclick="toggleIptvSidebar()" title="收起频道列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
        </div>

        <!-- M3U 源输入 -->
        <div class="iptv-url-bar">
            <input type="text" id="iptv-url-input" class="iptv-url-input" placeholder="输入 M3U 直播源链接..."
                   value="">
            <button id="iptv-load-btn" class="iptv-load-btn" onclick="loadM3U()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </button>
        </div>

        <!-- 频道搜索 -->
        <div class="iptv-search-bar">
            <svg class="iptv-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="iptv-channel-search" class="iptv-search-input" placeholder="搜索频道..."
                   oninput="filterChannels()">
        </div>

        <!-- 加载状态 -->
        <div id="iptv-loading" class="iptv-loading" style="display:none;">
            <div class="iptv-spinner"></div>
            <span>正在加载频道列表...</span>
        </div>

        <!-- 错误提示 -->
        <div id="iptv-error" class="iptv-error" style="display:none;"></div>

        <!-- 频道列表 -->
        <div class="iptv-channel-list" id="iptv-channel-list">
            <div class="iptv-empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="opacity:0.3;">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                    <polyline points="17 2 12 7 7 2"></polyline>
                </svg>
                <p>输入 M3U 直播源链接并点击加载</p>
                <p class="iptv-empty-hint">支持标准 M3U 格式，可包含多个频道分组</p>
            </div>
        </div>
    </aside>

    <!-- 主播放区 -->
    <div class="iptv-main">
        <!-- 桌面端展开频道列表按钮（仅在侧边栏收起时显示） -->
        <button class="iptv-expand-btn" id="iptv-expand-btn" onclick="toggleIptvSidebar()" title="展开频道列表" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </button>

        <!-- 当前频道信息条 -->

<!-- 播放器依赖 -->
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="/static/js/player.js"></script>

<script>
    // ===== 默认 M3U 源 =====
    const DEFAULT_M3U_URL = "https://live.zbds.top/tv/iptv4.m3u";

    // ===== 全局状态 =====
    let iptvPlayer = null;
    let allChannels = [];

    // ===== 初始化 =====
    document.addEventListener('DOMContentLoaded', () => {
        const urlInput = document.getElementById('iptv-url-input');
        const lastUrl = loadLastUrl();
        urlInput.value = lastUrl || DEFAULT_M3U_URL;
        loadM3U();
    });

    // ===== 加载 M3U =====
    async function loadM3U() {
        const url = document.getElementById('iptv-url-input').value.trim();
        if (!url) return;

        const loading = document.getElementById('iptv-loading');
        const error = document.getElementById('iptv-error');
        const list = document.getElementById('iptv-channel-list');
        const loadBtn = document.getElementById('iptv-load-btn');

        loading.style.display = 'flex';
        error.style.display = 'none';
        list.innerHTML = '';
        loadBtn.disabled = true;

        try {
            const resp = await fetch(url, { mode: 'cors' });
            if (!resp.ok) {
                throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            }
            const text = await resp.text();
            allChannels = parseM3U(text);
            if (allChannels.length === 0) {
                showError('M3U 文件中未找到任何频道。请检查链接是否正确。');
                return;
            }
            saveLastUrl(url);
            renderChannels(allChannels);
        } catch (err) {
            let msg = '';
            if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError') || err.name === 'TypeError') {
                msg = '<strong>加载失败：该源可能存在跨域限制</strong><br>请更换支持 CORS 的 M3U 源，或尝试在浏览器中直接打开该链接确认可用。';
            } else {
                msg = `<strong>加载失败</strong><br>${err.message}`;
            }
            msg += `<details><summary>错误详情</summary><pre>${err.stack || err.message}</pre></details>`;
            showError(msg);
        } finally {
            loading.style.display = 'none';
            loadBtn.disabled = false;
        }
    }

    function showError(html) {
        const error = document.getElementById('iptv-error');
        error.innerHTML = html;
        error.style.display = 'block';
        // 恢复空状态
        const list = document.getElementById('iptv-channel-list');
        list.innerHTML = `<div class="iptv-empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="opacity:0.3;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <p>加载失败，请检查链接</p>
        </div>`;
    }

    function saveLastUrl(url) {
        try { localStorage.setItem('iptv_last_url', url); } catch(e) {}
    }
    function loadLastUrl() {
        try { return localStorage.getItem('iptv_last_url'); } catch(e) { return null; }
    }

    // ===== 解析 M3U =====
    function parseM3U(text) {
        const lines = text.split(/\r?\n/);
        const channels = [];
        let currentExtinf = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line || line.startsWith('#EXTM3U') || line.startsWith('#EXT-X-')) {
                continue;
            }
            if (line.startsWith('#EXTINF:')) {
                const info = line.substring(8);

                // 提取属性
                const tvgName = extractAttr(info, 'tvg-name');
                const tvgLogo = extractAttr(info, 'tvg-logo');
                const groupTitle = extractAttr(info, 'group-title');

                // 逗号后的名称
                const commaIdx = info.lastIndexOf(',');
                const fallbackName = commaIdx >= 0 ? info.substring(commaIdx + 1).trim() : '';

                currentExtinf = {
                    name: tvgName || fallbackName || '未知频道',
                    logo: tvgLogo || '',
                    group: groupTitle || '其他',
                };
            } else if (!line.startsWith('#') && currentExtinf) {
                channels.push({
                    name: currentExtinf.name,
                    logo: currentExtinf.logo,
                    group: currentExtinf.group,
                    url: line,
                });
                currentExtinf = null;
            }
        }
        return channels;
    }

    function extractAttr(str, name) {
        const regex = new RegExp(name + '="([^"]*)"', 'i');
        const match = str.match(regex);
        return match ? match[1] : '';
    }

    // ===== 渲染频道列表 =====
    function renderChannels(channels) {
        const list = document.getElementById('iptv-channel-list');
        list.innerHTML = '';

        if (channels.length === 0) {
            list.innerHTML = '<div class="iptv-empty-state"><p>未找到任何频道</p></div>';
            return;
        }

        // 分组
        const groups = new Map();
        for (const ch of channels) {
            const g = ch.group || '其他';
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push(ch);
        }

        for (const [group, chs] of groups) {
            // 分组标题
            const header = document.createElement('div');
            header.className = 'iptv-group-header';
            header.textContent = group;
            list.appendChild(header);

            for (let i = 0; i < chs.length; i++) {
                const ch = chs[i];
                const item = document.createElement('div');
                item.className = 'iptv-channel-item';
                item.setAttribute('data-name', ch.name.toLowerCase());
                item.setAttribute('data-group', group);

                if (ch.logo) {
                    const img = document.createElement('img');
                    img.className = 'iptv-channel-logo';
                    img.src = ch.logo;
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = function() { this.style.display = 'none'; };
                    item.appendChild(img);
                }

                const name = document.createElement('span');
                name.className = 'iptv-channel-name';
                name.textContent = ch.name;
                item.appendChild(name);

                item.addEventListener('click', () => playChannel(ch, item));
                list.appendChild(item);
            }
        }
    }

    // ===== 播放频道 =====
    function playChannel(channel, element) {
        // 高亮当前频道
        document.querySelectorAll('.iptv-channel-item.active').forEach(el => el.classList.remove('active'));
        if (element) {
            element.classList.add('active');
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 更新顶部信息条
        const nowBar = document.getElementById('iptv-now-bar');
        const nowLogo = document.getElementById('iptv-now-logo');
        const nowName = document.getElementById('iptv-now-name');
        const nowGroup = document.getElementById('iptv-now-group');

        if (channel.logo) {
            nowLogo.src = channel.logo;
            nowLogo.style.display = 'block';
        } else {
            nowLogo.style.display = 'none';
        }
        nowName.textContent = channel.name;
        nowGroup.textContent = channel.group;
        nowBar.style.display = 'flex';

        // 销毁旧播放器
        if (iptvPlayer) {
            try { iptvPlayer.destroy(); } catch(e) {}
        }

        // 初始化新播放器
        iptvPlayer = initPlayer('iptv-artplayer', channel.url, {
            title: channel.name,
            isLive: true,
            sourceKey: 'iptv',
            vodId: 'iptv_' + Date.now(),
        });

        if (iptvPlayer) {
            iptvPlayer.play();
        }
    }

    // ===== 搜索过滤 =====
    function filterChannels() {
        const query = document.getElementById('iptv-channel-search').value.trim().toLowerCase();
        const items = document.querySelectorAll('.iptv-channel-item');
        const groups = document.querySelectorAll('.iptv-group-header');

        if (!query) {
            items.forEach(el => el.classList.remove('hidden'));
            groups.forEach(el => el.style.display = '');
            return;
        }

        // 跟踪每个分组是否有可见频道
        const groupVisibility = new Map();

        items.forEach(el => {
            const name = el.getAttribute('data-name') || '';
            if (name.includes(query)) {
                el.classList.remove('hidden');
                const group = el.getAttribute('data-group');
                groupVisibility.set(group, (groupVisibility.get(group) || 0) + 1);
            } else {
                el.classList.add('hidden');
            }
        });

        groups.forEach(el => {
            const visible = groupVisibility.get(el.textContent) || 0;
            el.style.display = visible > 0 ? '' : 'none';
        });
    }

    // ===== 移动端侧边栏切换 =====
    function toggleIptvSidebar() {
        const sidebar = document.getElementById('iptv-sidebar');
        const isMobile = window.innerWidth <= 768;

        if (isMobile) {
            sidebar.classList.toggle('open');
            // 创建/移除遮罩
            let overlay = document.querySelector('.iptv-sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'iptv-sidebar-overlay';
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                });
                document.body.appendChild(overlay);
            }
            overlay.classList.toggle('open', sidebar.classList.contains('open'));
        } else {
            sidebar.classList.toggle('collapsed');
            const expandBtn = document.getElementById('iptv-expand-btn');
            if (sidebar.classList.contains('collapsed')) {
                expandBtn.style.display = 'flex';
            } else {
                expandBtn.style.display = 'none';
            }
        }
    }

</script>
