services:
  web:
    build:
      context: .
    image: moovie-v4:local
    container_name: moovie-web
    env_file:
      - .env
    environment:
      APP_ENV: production
      WEB_ROOT: /app/web
      JOBS_IN_WEB: "false"
      DB_MAX_CONNS: "${WEB_DB_MAX_CONNS:-12}"
      GOMEMLIMIT: "${WEB_GO_MEMORY_LIMIT:-700MiB}"
      GOMAXPROCS: "${WEB_GOMAXPROCS:-2}"
      # 复用已连接 postgres_default 网络的 Cloudflare WARP 容器。
      HTTP_PROXY: socks5://cloudflare-warp:1080
      HTTPS_PROXY: socks5://cloudflare-warp:1080
      ALL_PROXY: socks5://cloudflare-warp:1080
      NO_PROXY: localhost,127.0.0.1,postgres,danmu-api
    ports:
      - "5008:5008"
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: "${WEB_MEMORY_LIMIT:-1g}"
    cpus: "${WEB_CPU_LIMIT:-2.0}"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - postgres_default
    healthcheck:
      # 数据库拥塞时 liveness 仍必须足够轻量。/ready 只供负载均衡判断，
      # 绝不能把它作为容器自动重启信号。
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
    image: moovie-v4:local
    container_name: moovie-worker
    entrypoint: ["./moovie-worker"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      JOBS_IN_WEB: "false"
      DB_MAX_CONNS: "${WORKER_DB_MAX_CONNS:-6}"
      GOMEMLIMIT: "${WORKER_GO_MEMORY_LIMIT:-320MiB}"
      GOMAXPROCS: "${WORKER_GOMAXPROCS:-1}"
      # 复用已连接 postgres_default 网络的 Cloudflare WARP 容器。
      HTTP_PROXY: socks5://cloudflare-warp:1080
      HTTPS_PROXY: socks5://cloudflare-warp:1080
      ALL_PROXY: socks5://cloudflare-warp:1080
      NO_PROXY: localhost,127.0.0.1,postgres,danmu-api
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: "${WORKER_MEMORY_LIMIT:-512m}"
    cpus: "${WORKER_CPU_LIMIT:-1.0}"
    pids_limit: 128
    read_only: true
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - postgres_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  
  # 弹幕聚合服务，仅供 app 内网调用，不对外映射端口
  danmu-api:
    image: logvar/danmu-api:latest
    container_name: moovie-danmu-api-v4
    env_file:
      - .env
    environment:
      # 与 .env 里的 DANMU_API_BASE 路径前缀保持一致
      - TOKEN=${DANMU_API_TOKEN:-changeme}
      # 必须为 0：经 app 代理后上游只看得到同一个来源 IP，
      # 默认的 3次/分钟 会让第 4 个访客开始全部拿不到弹幕。
      # 真正的限流在 app 侧按访客 IP 做（见 internal/handler/danmaku.go）
      - RATE_LIMIT_MAX_REQUESTS=0
      - COMMENT_CACHE_MINUTES=60
      - SEARCH_CACHE_MINUTES=30
      - DANMU_LIMIT=5
      - LIKE_SWITCH=false
      - LOG_LEVEL=warn
      - TZ=Asia/Shanghai
      # WARP 代理配置 - 走 SOCKS5
      - HTTP_PROXY=socks5://cloudflare-warp:1080
      - HTTPS_PROXY=socks5://cloudflare-warp:1080
      - ALL_PROXY=socks5://cloudflare-warp:1080
    volumes:
      - ./danmu-cache:/app/.cache
    restart: unless-stopped
    networks:
      - postgres_default
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  postgres_default:
    external: true
