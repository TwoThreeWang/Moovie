{{ if .Backdrops }}
{{ $total := len .Backdrops }}
<div class="movie-backdrops-section">
    <div class="backdrops-grid" id="backdropsGrid">
        {{ range $i, $url := .Backdrops }}{{ if lt $i 8 }}
        <div class="backdrop-item" onclick="openLightbox({{ $i }})">
            <img src="{{ proxyImg $url }}" loading="lazy" alt="电影剧照" onerror="this.onerror=null;this.src='/static/img/placeholder.svg'">
            {{ if and (eq $i 7) (gt $total 8) }}<span class="backdrop-more backdrop-more-pc">+{{ sub $total 8 }}</span>{{ end }}
            {{ if and (eq $i 3) (gt $total 4) }}<span class="backdrop-more backdrop-more-mb">+{{ sub $total 4 }}</span>{{ end }}
        </div>
        {{ end }}{{ end }}
    </div>
</div>

<div id="backdropLightbox" class="backdrop-lightbox">
    <button type="button" class="lightbox-nav lightbox-prev" onclick="stepLightbox(-1)" aria-label="上一张">&#8249;</button>
    <img id="lightboxImg" alt="剧照大图" onerror="this.onerror=null;this.src='/static/img/placeholder.svg'">
    <button type="button" class="lightbox-nav lightbox-next" onclick="stepLightbox(1)" aria-label="下一张">&#8250;</button>
    <div class="lightbox-counter"><span id="lightboxIndex">1</span> / <span id="lightboxTotal">1</span></div>
    <button type="button" class="lightbox-close" onclick="closeLightbox()" aria-label="关闭">&times;</button>
</div>

<script>
var MOOVIE_BACKDROPS = [{{ range $i, $url := .Backdrops }}{{ if $i }},{{ end }}{{ $url }}{{ end }}];
</script>

<style>
.movie-backdrops-section {
    margin-top: 1rem;
    margin-bottom: 2rem;
}

/* 固定 4×2 网格，页面高度恒定，不再有展开/收起 */
.backdrops-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.backdrop-item {
    position: relative;
    cursor: pointer;
    border-radius: var(--radius-sm, 8px);
    overflow: hidden;
    aspect-ratio: 16/9;
    background: var(--bg-secondary, #1a1c22);
    border: 1px solid var(--border, rgba(255,255,255,0.05));
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.backdrop-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.backdrop-item:hover {
    border-color: var(--primary-text);
    transform: translateY(-2px);
}

.backdrop-item:hover img {
    transform: scale(1.08);
}

/* 「+N」蒙层：盖在最后一格可见缩略图上 */
.backdrop-more {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    backdrop-filter: blur(2px);
    transition: background 0.2s ease;
}

.backdrop-item:hover .backdrop-more {
    background: rgba(0, 0, 0, 0.45);
}

.backdrop-more-mb { display: none; }

/* Lightbox */
.backdrop-lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.92);
    z-index: 10000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.backdrop-lightbox.active {
    display: flex;
    opacity: 1;
}

.backdrop-lightbox img {
    max-width: 88%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    transform: scale(0.95);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
    -webkit-user-drag: none;
}

.backdrop-lightbox.active img {
    transform: scale(1);
}

.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
}

.lightbox-nav:hover {
    background: rgba(255, 255, 255, 0.22);
}

.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }

.lightbox-counter {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.75);
    font-size: 0.8125rem;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
}

.lightbox-close {
    position: absolute;
    top: 20px;
    right: 25px;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 35px;
    font-weight: 300;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    transition: transform 0.2s;
}

.lightbox-close:hover {
    transform: scale(1.2);
    color: var(--primary-text);
}

@media (max-width: 768px) {
    /* 手机端 2×2，多出的缩略图不进视口 */
    .backdrops-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }
    .backdrop-item:nth-child(n+5) { display: none; }
    .backdrop-more-pc { display: none; }
    .backdrop-more-mb { display: flex; }

    /* 手机端靠滑动翻页，箭头让位给图片 */
    .lightbox-nav { display: none; }
    .backdrop-lightbox img { max-width: 96%; }
}
</style>

<script>
(function () {
    var idx = 0;

    function srcFor(url) {
        // 保持原有的图片代理规则
        var encoded = btoa(url);
        return '/api/proxy/image/r76RqSIVvUryzx' + encoded + (url.indexOf('tmdb') !== -1 ? '?raw=1' : '');
    }

    function preload(i) {
        if (i < 0 || i >= MOOVIE_BACKDROPS.length) return;
        var im = new Image();
        im.onerror = function() { this.onerror = null; this.src = '/static/img/placeholder.svg'; };
        im.src = srcFor(MOOVIE_BACKDROPS[i]);
    }

    function render() {
        var img = document.getElementById('lightboxImg');
        img.onerror = function() { this.onerror = null; this.src = '/static/img/placeholder.svg'; };
        img.src = srcFor(MOOVIE_BACKDROPS[idx]);
        document.getElementById('lightboxIndex').textContent = idx + 1;
        document.getElementById('lightboxTotal').textContent = MOOVIE_BACKDROPS.length;
        preload(idx + 1);
        preload(idx - 1);
    }

    window.openLightbox = function (i) {
        if (!MOOVIE_BACKDROPS.length) return;
        idx = i || 0;
        render();
        document.getElementById('backdropLightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.stepLightbox = function (delta) {
        var n = MOOVIE_BACKDROPS.length;
        idx = (idx + delta + n) % n; // 首尾循环
        render();
    };

    window.closeLightbox = function () {
        var lightbox = document.getElementById('backdropLightbox');
        var img = document.getElementById('lightboxImg');
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(function () {
            // 关闭后移除地址，空 src 会让部分浏览器重复请求当前详情页。
            if (!lightbox.classList.contains('active')) img.removeAttribute('src');
        }, 300);
    };

    var lightbox = document.getElementById('backdropLightbox');

    // 点空白处关闭，点图片/箭头不关闭
    lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') stepLightbox(-1);
        else if (e.key === 'ArrowRight') stepLightbox(1);
    });

    // 手机端左右滑动翻页
    var startX = null, startY = null;
    lightbox.addEventListener('touchstart', function (e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener('touchend', function (e) {
        if (startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        var dy = e.changedTouches[0].clientY - startY;
        // 横向位移够大且不是竖滑，才算翻页
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
            stepLightbox(dx < 0 ? 1 : -1);
        }
        startX = startY = null;
    }, { passive: true });
})();
</script>
{{ end }}
