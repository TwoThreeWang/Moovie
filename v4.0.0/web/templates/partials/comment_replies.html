{{ define "comment_replies.html" }}
{{ if .Replies }}
<div class="comment-reply-list">
    {{ range .Replies }}
    <div class="comment-reply-item">
        <span class="comment-reply-user">
            <span class="comment-reply-avatar">{{ default "🎬" .User.Avatar }}</span>
            {{ default "匿名用户" .User.Username }}
        </span>
        <span class="comment-reply-text">{{ .Content }}</span>
        <span class="comment-reply-time">{{ .CreatedAt.Format "01-02 15:04" }}</span>
    </div>
    {{ end }}
</div>
{{ end }}
{{ if .CurrentUserID }}
<form class="comment-reply-form"
      hx-post="/api/comments/{{ .UserMovieID }}/replies"
      hx-target="#comment-replies-{{ .UserMovieID }}"
      hx-swap="innerHTML">
    <input type="text" name="content" class="comment-reply-input" placeholder="回复这条短评..." maxlength="300" required>
    <button type="submit" class="btn btn-outline comment-reply-submit">发送</button>
</form>
{{ else }}
<p class="comment-reply-login-hint"><a href="/auth/login">登录</a>后可以回复</p>
{{ end }}
{{ end }}
