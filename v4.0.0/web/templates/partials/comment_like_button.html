{{ define "comment_like_button.html" }}
<button type="button"
        class="comment-like-btn{{ if .Liked }} liked{{ end }}"
        id="comment-like-{{ .UserMovieID }}"
        hx-post="/api/comments/{{ .UserMovieID }}/like"
        hx-target="#comment-like-{{ .UserMovieID }}"
        hx-swap="outerHTML"
        title="{{ if .Liked }}取消点赞{{ else }}点赞{{ end }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="{{ if .Liked }}currentColor{{ else }}none{{ end }}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"></path></svg>
    <span class="comment-like-count">{{ if gt .LikeCount 0 }}{{ .LikeCount }}{{ end }}</span>
</button>
{{ end }}
