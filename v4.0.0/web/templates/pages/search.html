
{{ define "content" }}
<div class="search-hero">
    <form class="search-form" action="/search" method="GET">
        <div class="search-input-wrapper">
            <input
                type="text"
                name="kw"
                class="search-input"
                value="{{ .Keyword }}"
                placeholder="搜索电影、电视剧..."
                autocomplete="off"
            >
            <button type="submit" class="search-btn">搜索</button>
        </div>
    </form>
    <p class="search-result-hint">「{{ .Keyword }}」的搜索结果</p>
</div>

<!-- 豆瓣电影卡片 -->
<div id="douban-card-container"
     hx-get="/api/htmx/douban-card?kw={{ urlquery .Keyword }}"
     hx-trigger="load"
     hx-indicator="#douban-card-loading"
     hx-swap="outerHTML">
    <div id="douban-card-loading" class="htmx-card-indicator htmx-indicator" role="status" aria-live="polite">
        <div class="htmx-skeleton-poster" aria-hidden="true"></div>
        <div class="htmx-skeleton-copy" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span class="htmx-loading-label" aria-label="正在匹配影片信息..." aria-hidden="true"></span>
    </div>
</div>

<div id="search-results-container"
	 hx-get="/api/htmx/search?q={{ urlquery .Keyword }}{{ if .Bypass }}&bypass=1{{ end }}"
	 hx-trigger="load"
     hx-indicator="#search-loading">
    <div id="search-loading" class="htmx-indicator search-loading-state">
        <div class="search-loading-spinner" aria-hidden="true"></div>
        <p>正在搜索全网资源，请稍候...</p>
    </div>
</div>
<div class="ad-slot">
<script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
 <ins class="eas6a97888e20" data-zoneid="5863824"></ins>
 <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
</div>

<script>
// 记录搜索词到最近搜索
document.addEventListener('DOMContentLoaded', function() {
    const keyword = "{{ .Keyword }}";
    if (keyword && typeof addRecentSearch === 'function') {
        addRecentSearch(keyword);
    }
});
</script>
{{ end }}
