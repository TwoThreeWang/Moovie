{{ define "content" }}
<div class="home-hero">
    <h1><img src="/static/img/logo.png" alt="" class="hero-logo" width="224" height="227" fetchpriority="high" onerror="this.onerror=null;this.src='/static/img/placeholder.svg'"> Moovie 影牛</h1>
    <p class="hero-subtitle">搜全网，只为你想看的那一部</p>
    <p class="hero-subtitle-small">电影、剧集、综艺与动漫，一站搜索</p>

    <form class="search-form" action="/search" method="GET">
        <div class="search-input-wrapper">
            <input
                type="text"
                name="kw"
                class="search-input"
                placeholder="想看就搜，看你想看..."
                autocomplete="off"
                required
                id="search-input"
                oninput="handleSearchInput(this.value)"
            >
            <button type="submit" class="search-btn">搜索</button>
        </div>
        <!-- 搜索建议下拉框 -->
        <div id="search-suggestions" class="search-suggestions" style="display: none;"></div>
    </form>
</div>

<!-- 最近搜索 -->
<div class="tags-section" id="recent-searches-section">
    <div class="tags-header">
        <span class="tags-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            最近搜索
        </span>
        <span class="tags-toggle" onclick="clearRecentSearches()">清空全部</span>
    </div>
    <div class="trending-tags" id="recent-searches">
        <!-- 由 JavaScript 从 localStorage 填充 -->
    </div>
</div>

{{/*
    今日更新：区块外壳在 partial 内部，因此这里只放一个空占位容器。
    未登录、没有在看的剧、或今天没有更新时端点返回空响应，
    这个 div 保持为空，首页不会多出任何标题或留白。
*/}}
<div id="today-updates"
     hx-get="/api/htmx/history/today-updates"
     hx-trigger="load"
     hx-swap="innerHTML"></div>

<!-- 继续观看 -->
<section class="section" id="continue-watching-section">
    <div class="section-header">
        <span class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            继续观看
            <small id="continue-watching-hint" style="color: var(--text-muted); font-weight: normal; font-size: 0.75rem;">数据存于您的浏览器本地</small>
        </span>
    </div>
    <div id="continue-watching">
        <!-- 由 JavaScript 从 localStorage 填充 -->
        <div class="loading-state" style="text-align: center; padding: 2rem; width: 100%;">
            <span class="loading-spinner"></span> 正在渲染...
        </div>
    </div>
</section>

<script>
(function() {
    /**
     * 获取播放状态记录
     */
    function getPlayState() {
        try {
            return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
        } catch {
            return {};
        }
    }

    /**
     * 删除单个观看记录
     */
    async function removeWatchHistory(itemKey) {
        try {
            const data = getPlayState();
            const item = data[itemKey];
            if (item) {
                if (typeof window.queueHistoryDelete === 'function') {
                    window.queueHistoryDelete(item);
                }
                delete data[itemKey];
                localStorage.setItem(HISTORY_KEY, JSON.stringify(data));
                renderContinueWatching();
            }
        } catch (error) {
            console.error('删除观看记录失败:', error);
        }
    }

    /**
     * 渲染继续观看列表
     */
    function renderLocalContinueWatching() {
        const container = document.getElementById('continue-watching');
        if (!container) return;
        container.classList.add('movie-grid');

        const playState = getPlayState();
        const history = Object.values(playState)
            .filter(item => item.title && item.source_key !== 'iptv')
            .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

        if (history.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'empty-state';
            empty.textContent = '暂无观看记录';
            container.replaceChildren(empty);
            return;
        }

        const getItemKey = (item) => `${item.source_key || ''}${item.vod_id || ''}`;

		const cards = history.map(item => {
			const progress = item.duration > 0 ? Math.min((item.lastTime / item.duration) * 100, 100) : 0;
			let playUrl = '';
			if (item.entry_page === 'watch' && item.douban_id) {
				const params = new URLSearchParams();
				if (item.episode) params.set('ep', item.episode);
				if (item.source_key && item.vod_id) {
					params.set('source_key', item.source_key);
					params.set('vod_id', item.vod_id);
				}
				const qs = params.toString();
				playUrl = `/watch/${encodeURIComponent(item.douban_id)}${qs ? '?' + qs : ''}`;
			} else if (item.source_key && item.vod_id) {
				const params = new URLSearchParams();
                if (item.episode) params.set('ep', item.episode);
                if (item.douban_id) params.set('douban_id', item.douban_id);
                const qs = params.toString();
                playUrl = `/play/${encodeURIComponent(item.source_key)}/${encodeURIComponent(item.vod_id)}${qs ? '?' + qs : ''}`;
            } else {
                playUrl = `/search?kw=${encodeURIComponent(item.title || '')}`;
            }

            const itemKey = getItemKey(item);
            const wrapper = document.createElement('div');
            wrapper.className = 'movie-card-wrapper';
            const link = document.createElement('a');
            link.href = playUrl;
            link.className = 'movie-card';
            link.title = `继续播放 ${item.title || ''}`;
            const poster = document.createElement('div');
            poster.className = 'movie-poster';
            const image = document.createElement('img');
            let posterURL = '/static/img/placeholder.svg';
            if (typeof item.img === 'string' && (item.img.startsWith('/api/proxy/image/') || item.img.startsWith('/static/'))) {
                posterURL = item.img;
            } else if (typeof item.img === 'string' && /^https?:\/\//i.test(item.img)) {
                try { posterURL = '/api/proxy/image/r76RqSIVvUryzx' + btoa(item.img); } catch (_) {}
            }
            image.src = posterURL;
            image.alt = item.title || '';
            image.loading = 'lazy';
            image.referrerPolicy = 'no-referrer';
            image.onerror = function() { this.onerror = null; this.src = '/static/img/placeholder.svg'; };
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-bar-container';
            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            progressBar.style.width = `${progress.toFixed(1)}%`;
            progressContainer.appendChild(progressBar);
            poster.append(image, progressContainer);
            const info = document.createElement('div');
            info.className = 'movie-info';
            const title = document.createElement('h3');
            title.className = 'movie-title';
            title.textContent = item.title || '未知';
            const episode = document.createElement('p');
            episode.className = 'movie-year';
            episode.textContent = `${item.source_key ? `[${item.source_key}] ` : ''}${item.episode || '继续观看'}`;
            info.append(title, episode);
            link.append(poster, info);
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'watch-delete-btn';
            remove.title = '删除此记录';
            remove.setAttribute('aria-label', '删除此记录');
            remove.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            remove.addEventListener('click', event => {
                event.preventDefault();
                event.stopPropagation();
                window._removeWatchHistory(itemKey);
            });
            wrapper.append(link, remove);
            return wrapper;
        });
        container.replaceChildren(...cards);
    }

    async function renderContinueWatching() {
        const container = document.getElementById('continue-watching');
        if (!container) return;

        // Logged-in users use the server's canonical history as the source of
        // truth. The local list remains the offline/anonymous fallback.
        if (typeof isLoggedIn === 'function' && isLoggedIn()) {
            try {
                const response = await fetch('/api/htmx/history/recent', { headers: { 'HX-Request': 'true' }, credentials: 'same-origin' });
                if (response.ok) {
                    container.classList.remove('movie-grid');
                    container.innerHTML = await response.text();
                    if (window.htmx) htmx.process(container);
                    return;
                }
            } catch (error) {
                console.warn('读取云端观看记录失败，使用本机记录:', error);
            }
        }
        renderLocalContinueWatching();
    }

    // 暴露删除方法给内联 onclick 使用
    window._removeWatchHistory = removeWatchHistory;

    // 更新副标题
    function updateContinueWatchingHint() {
        const hint = document.getElementById('continue-watching-hint');
        if (hint && typeof isLoggedIn === 'function' && isLoggedIn()) {
            hint.textContent = '数据已云端同步';
        }
    }

    // 初始渲染
    document.addEventListener('DOMContentLoaded', () => {
        updateContinueWatchingHint();
        renderContinueWatching();
    });

    // 监听全局同步完成事件，自动刷新列表
    document.addEventListener('moovie:history-updated', renderContinueWatching);
})();
</script>
{{ end }}
