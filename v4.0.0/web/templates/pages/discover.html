
{{ define "content" }}
<h1 class="page-title">发现</h1>
<p class="page-subtitle">发现全网最热门的影视作品</p>

<!-- 热门分类导航 -->
<div class="tab-nav discover-tab-nav" role="navigation" aria-label="热门分类">
    <a href="/discover/movie"
       hx-get="/discover/movie"
       hx-target="#discover-content"
       hx-push-url="true"
       hx-on:click="showDiscoverLoading()"
       class="tab-btn {{ if eq .CurrentType "movie" }}active{{ end }}"
       {{ if eq .CurrentType "movie" }}aria-current="page"{{ end }}
       onclick="updateActiveTab(this)">热门电影</a>
    <a href="/discover/tv"
       hx-get="/discover/tv"
       hx-target="#discover-content"
       hx-push-url="true"
       hx-on:click="showDiscoverLoading()"
       class="tab-btn {{ if eq .CurrentType "tv" }}active{{ end }}"
       {{ if eq .CurrentType "tv" }}aria-current="page"{{ end }}
       onclick="updateActiveTab(this)">热门剧集</a>
    <a href="/discover/show"
       hx-get="/discover/show"
       hx-target="#discover-content"
       hx-push-url="true"
       hx-on:click="showDiscoverLoading()"
       class="tab-btn {{ if eq .CurrentType "show" }}active{{ end }}"
       {{ if eq .CurrentType "show" }}aria-current="page"{{ end }}
       onclick="updateActiveTab(this)">热门综艺</a>
    <a href="/discover/cartoon"
       hx-get="/discover/cartoon"
       hx-target="#discover-content"
       hx-push-url="true"
       hx-on:click="showDiscoverLoading()"
       class="tab-btn {{ if eq .CurrentType "cartoon" }}active{{ end }}"
       {{ if eq .CurrentType "cartoon" }}aria-current="page"{{ end }}
       onclick="updateActiveTab(this)">日本动画</a>
</div>

<div id="discover-content-wrapper" class="discover-content-wrapper">
    <!-- 内容区域 -->
    <div id="discover-content"
         hx-get="/discover/{{ .CurrentType }}"
         hx-trigger="load">
        <!-- 初始加载通过 htmx 触发 -->
        <div class="discover-loading" role="status" aria-label="正在加载热门内容"><div class="discover-spinner" aria-hidden="true"></div></div>
    </div>
</div>

<script>
    function updateActiveTab(el) {
        document.querySelectorAll('.discover-tab-nav .tab-btn').forEach(btn => {
            const active = btn === el;
            btn.classList.toggle('active', active);
            if (active) btn.setAttribute('aria-current', 'page');
            else btn.removeAttribute('aria-current');
        });
    }

    function syncDiscoverActiveTab() {
        const match = window.location.pathname.match(/^\/discover\/(movie|tv|show|cartoon)$/);
        const currentPath = '/discover/' + (match ? match[1] : 'movie');
        document.querySelectorAll('.discover-tab-nav .tab-btn').forEach(btn => {
            const active = new URL(btn.href, window.location.origin).pathname === currentPath;
            btn.classList.toggle('active', active);
            if (active) btn.setAttribute('aria-current', 'page');
            else btn.removeAttribute('aria-current');
        });
    }

    function showDiscoverLoading() {
        const content = document.getElementById('discover-content');
        if (content) {
            content.innerHTML = '<div class="discover-loading" role="status" aria-label="正在加载热门内容"><div class="discover-spinner" aria-hidden="true"></div></div>';
        }
    }

    document.addEventListener('htmx:historyRestore', syncDiscoverActiveTab);
    window.addEventListener('popstate', () => requestAnimationFrame(syncDiscoverActiveTab));
</script>

{{ end }}
